# docker-compose.yml
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - duckdb_data:/data/dbs
      - ./data:/app/data:ro        # sample dataset read-only
    env_file: .env
    environment:
      - DUCKDB_DATA_DIR=/data/dbs
    depends_on: []

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  duckdb_data:
