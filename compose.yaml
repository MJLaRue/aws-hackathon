services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: uic_budget
      MYSQL_USER: budget
      MYSQL_PASSWORD: budget_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - budget_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  budget_mysql:
